  <script>
    // Universal API Origin Resolver for Tauri (tauri://), Localhost, and Tunnel
    (function() {
      const isCustomScheme = window.location.protocol === 'tauri:' ||
                             window.location.protocol === 'file:' ||
                             window.location.origin.includes('tauri.localhost');
      if (isCustomScheme) {
        const origFetch = window.fetch;
        window.fetch = function(input, init) {
          if (typeof input === 'string' && input.startsWith('/')) {
            input = 'http://127.0.0.1:8888' + input;
          } else if (input instanceof Request && input.url.startsWith('/')) {
            input = new Request('http://127.0.0.1:8888' + input.url, init);
          }
          return origFetch.call(this, input, init);
        };
      }
    })();
  </script>
  <script>
    // Suppress Tailwind CDN non-production notice in console
    (function() {
      const _origWarn = console.warn;
      console.warn = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
        _origWarn.apply(console, args);
      };
    })();
  </script>
