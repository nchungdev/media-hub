name: Release Media Hub Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.4.0)'
        required: false
        default: 'v2.4.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Desktop App (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target_flag: '--arm64'
          - arch: x64
            target_flag: '--x64'

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'electron/package-lock.json'

      - name: 🐍 Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Electron Dependencies
        run: |
          cd electron
          npm ci

      - name: 🔨 Build macOS App & DMG (${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npx electron-builder --mac ${{ matrix.target_flag }}

      - name: 🗜️ Archive DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-hub-macos-${{ matrix.arch }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.blockmap
          if-no-files-found: error

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 📋 Prepare Release Assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -name "*.dmg" -exec cp {} dist-release/ \;
          find release-artifacts -type f -name "*.blockmap" -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: 📢 Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.dmg
            dist-release/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
